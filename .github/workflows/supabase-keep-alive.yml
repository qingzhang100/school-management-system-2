name: Supabase Keep Alive

on:
  schedule:
    # 每天凌晨 3 点（UTC）跑一次（你可以改成每周或每月）
    - cron: "0 3 * * *"
  workflow_dispatch: # 手动触发

jobs:
  ping-supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase to prevent inactivity
        run: |
          echo "Sending keep-alive request to Supabase..."

          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE_NAME}?select=1&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json")

          echo "Response status: $STATUS_CODE"

          if [ "$STATUS_CODE" -ge 400 ]; then
            echo "Warning: Supabase returned an error status ($STATUS_CODE)"
          fi

        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_TABLE_NAME: ${{ secrets.SUPABASE_TABLE_NAME }}
